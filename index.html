    <meta name="theme-color" content="#0a0608" />

    <title>Debbie &amp; Jason — After Party</title>
    <meta
      name="description"
      content="Vows said, dinner done — the after party. Saturday, the 30th of October, 2027, from 9pm. Urban Brewing, Dublin."
    />

    <!--
      Link preview for WhatsApp, iMessage and email clients.
      These URLs MUST be absolute — relative paths are ignored by every scraper.
      If the site moves, update these by hand along with SITE_URL in src/content.js.

      Keep the word "After Party" in og:title. Guests may have both this link and
      the full-day invite in the same chat, and the preview title is the only
      thing distinguishing them at a glance.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Debbie &amp; Jason" />
    <meta property="og:title" content="Debbie &amp; Jason — After Party · 30 October 2027" />
    <meta
      property="og:description"
      content="Vows said, dinner done. Come and dance with us at Urban Brewing, Dublin, from 9pm — tap for all the details."
    />
    <meta property="og:url" content="https://j-etienne1.github.io/afters-invite/" />
    <meta
      property="og:image"
      content="https://j-etienne1.github.io/afters-invite/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Illustrated gothic portrait of Debbie and Jason, surrounded by bats."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Debbie &amp; Jason — After Party · 30 October 2027" />
    <meta
      name="twitter:description"
      content="Vows said, dinner done. Come and dance with us at Urban Brewing, Dublin, from 9pm — tap for all the details."
    />
    <meta
      name="twitter:image"
      content="https://j-etienne1.github.io/afters-invite/og-image.jpg"
    />
